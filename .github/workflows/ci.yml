name: CI

on:
  push:
    branches: [main]
  pull_request:

# Laufende Prüfungen einer älteren Fassung werden abgebrochen,
# sobald ein neuer Commit auf denselben Branch kommt.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Typen, Tests und Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: komon
          POSTGRES_PASSWORD: komon
          POSTGRES_DB: komon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komon -d komon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://komon:komon@localhost:5432/komon?schema=public
      # Die Integrationstests legen sich je Lauf ein eigenes Schema an.
      TEST_DATABASE_URL: postgresql://komon:komon@localhost:5432/komon?schema=public
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Prisma-Client erzeugen
        run: npx prisma generate

      - name: Datenbank aufbauen
        run: npx prisma migrate deploy

      - name: Typen prüfen
        run: npm run typecheck

      - name: Tests ausführen
        run: npm test

      - name: Anwendung bauen
        run: npm run build
